syntax = "proto3";

option java_multiple_files = true;
option java_package = "servicestubs.managerserver";

package grpcservice_manager_server;

service RegisterService {
  rpc register(ServerId) returns (RedisId);
}

message ServerId {
  string ip = 1;
  int32 port = 2;
}

message RedisId {
  string ip = 1;
  int32 port = 2;
}