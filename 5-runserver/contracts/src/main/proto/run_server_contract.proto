syntax = "proto3";

option java_multiple_files = true;
option java_package = "servicestubs.runserver";
option java_outer_classname = "RunServerContract";

package grpcservice_runserver;

// Contrato c: Client -> RunServer.
service RunServerService {
  // O cliente envia o programa em blocos e recebe um UUID quando a submissão termina.
  rpc submitProgram(stream SubmitProgramRequest) returns (SubmitProgramResponse);
  rpc getStatus(GetStatusRequest) returns (GetStatusResponse);
  // O resultado é devolvido por streaming; podem ser enviados vários blocos.
  rpc getResult(GetResultRequest) returns (stream GetResultResponse);
}

message SubmitProgramRequest {
  bytes data = 1;
  bytes stdin = 2;
  bool is_last = 3;
}

message SubmitProgramResponse {
  string execution_id = 1;
}

message GetStatusRequest {
  string execution_id = 1;
}

message GetStatusResponse {
  string status = 1;
}

message GetResultRequest {
  string execution_id = 1;
}

message GetResultResponse {
  string status = 1;
  bytes stdout = 2;
  bytes stderr = 3;
  int32 exit_code = 4;
  // true no último bloco; permite distinguir um resultado completo.
  bool finished = 5;
}
