 */

plugins {
    // Apply the application plugin to add support for building a CLI application in Java.
    id 'application'
    id 'com.google.protobuf' version '0.9.5'
}

repositories {
    // Use Maven Central for resolving dependencies.
    mavenCentral()
}

def grpcVersion = '1.68.1'
def protobufVersion = '3.25.5'

dependencies {
    // Use JUnit Jupiter for testing.
    testImplementation libs.junit.jupiter

    testRuntimeOnly 'org.junit.platform:junit-platform-launcher'

    // This dependency is used by the application.
    implementation libs.guava

    implementation "io.grpc:grpc-netty-shaded:${grpcVersion}"
    implementation "io.grpc:grpc-protobuf:${grpcVersion}"
    implementation "io.grpc:grpc-stub:${grpcVersion}"
    // Cliente Java para Redis (usado pelo Client e partilhado com o RunServer).
    implementation "redis.clients:jedis:5.2.0"
    compileOnly 'org.apache.tomcat:annotations-api:6.0.53'
}

sourceSets {
    main { proto { srcDir '../contracts/src/main/proto' } }
}

protobuf {
    protoc { artifact = "com.google.protobuf:protoc:${protobufVersion}" }
    plugins { grpc { artifact = "io.grpc:protoc-gen-grpc-java:${grpcVersion}" } }
    generateProtoTasks { all()*.plugins { grpc {} } }
}

// Apply a specific Java toolchain to ease working on different environments.
java {
    toolchain {
        languageVersion = JavaLanguageVersion.of(21)
    }
}

application {
    // Define the main class for the application.
    mainClass = 'manager.server.App'
}

tasks.named('test') {
    // Use JUnit Platform for unit tests.
    useJUnitPlatform()
}

tasks.register('testClient', JavaExec) {
    classpath = sourceSets.main.runtimeClasspath
    mainClass = 'manager.server.TestClient'
}

// Executa o cliente CodeRunner.
// Exemplo: gradlew.bat runClient --args="submit localhost 50051 localhost 6379 programa.py input.txt"
tasks.register('runClient', JavaExec) {
    group = 'application'
    description = 'Executa o cliente CodeRunner'
    classpath = sourceSets.main.runtimeClasspath
    mainClass = 'manager.server.Client'
}
